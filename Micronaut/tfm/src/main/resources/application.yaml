datasources:
  default:
    url: jdbc:postgresql://localhost:5432/tfm_micronaut
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

micronaut:
  server:
    cors:
      enabled: true
      configurations:
        frontend:
          allowed-origins:
            - http://localhost:5173
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - Content-Type
            - Accept